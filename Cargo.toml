[package]
name = "btreedb"
version = "0.1.0"
edition = "2021"
license = "MIT"
default-run = "btreedb"

[features]
default = []
# Scaffolding modules (transaction, compression, concurrency, backup, value, manager).
experimental = []

[dependencies]
byteorder = "1.5"
crc32fast = "1.4"
rustyline = "14.0"

[dev-dependencies]
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench"
harness = false

